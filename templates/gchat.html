    <!-- ======= login script ====== -->

    <script>
      const publishableKey =
        "pk_test_dGlnaHQtb3J5eC04MC5jbGVyay5hY2NvdW50cy5kZXYk"; // <- Add Publishable Key here

      const startClerk = async () => {
        const Clerk = window.Clerk;

        try {
          // Load Clerk environment and session if available
          await Clerk.load();

          const userButton = document.getElementById("user-button");
          const authLinks = document.getElementById("auth-links");

          Clerk.addListener(({ user }) => {
            // Display links conditionally based on user state
            authLinks.style.display = user ? "none" : "block";
          });

          if (Clerk.user) {
            // Mount user button component
            Clerk.mountUserButton(userButton);
            userButton.style.margin = "auto";
          }
        } catch (err) {
          console.error("Error starting Clerk: ", err);
        }
      };

      (() => {
        const script = document.createElement("script");
        script.setAttribute("data-clerk-publishable-key", publishableKey);
        script.async = true;
        script.src = `https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js`;
        script.crossOrigin = "anonymous";
        script.addEventListener("load", startClerk);
        script.addEventListener("error", () => {
          document.getElementById("no-frontend-api-warning").hidden = false;
        });
        document.body.appendChild(script);
      })();
    </script>
    <main id="main" class="main">
      <section class="section">
        <div id="landing">
          <input type="text" id="username" placeholder="Username" />
          <button id="join-btn">JOIN</button>
        </div>

        <div id="chat" style="display: none">

    <script>
      const socket = io({ autoConnect: false });

      document
        .getElementById("join-btn")
        .addEventListener("click", function () {
          let username = document.getElementById("username").value;

          socket.connect();

          socket.on("connect", function () {
            socket.emit("user_join", username);
          });

          document.getElementById("chat").style.display = "block";
          document.getElementById("landing").style.display = "none";
        });

      document
        .getElementById("message")
        .addEventListener("keyup", function (event) {
          if (event.key == "Enter") {
            let message = document.getElementById("message").value;
            socket.emit("new_message", message);
            document.getElementById("message").value = "";
          }
        });

      socket.on("chat", function (data) {
        let ul = document.getElementById("chat-messages");
        let li = document.createElement("li");
        li.appendChild(
          document.createTextNode(data["username"] + ": " + data["message"])
        );
        ul.appendChild(li);
        ul.scrolltop = ul.scrollHeight;
      });
    </script>
